      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalace prostredi
        run: |
          pip install -r requirements.txt > /dev/null 2>&1
          playwright install chromium > /dev/null 2>&1
      - name: Sledovani mapy ODIS (Blok 3)
        run: python sledovani.py

  blok_4_hodiny_18_az_24:
    needs: blok_3_hodiny_12_az_18
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalace prostredi
        run: |
          pip install -r requirements.txt > /dev/null 2>&1
          playwright install chromium > /dev/null 2>&1
      - name: Sledovani mapy ODIS (Blok 4)
        run: python sledovani.py
